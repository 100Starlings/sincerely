require:
  - rubocop-rspec
  - rubocop-rails

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1.X

Documentation:
  Enabled: false
Layout/LineLength:
  Max: 120
RSpec/NestedGroups:
  Enabled: false

# Keep :unprocessable_entity for Rails < 7.1 compatibility
Rails/ResponseParsedBody:
  Enabled: false
